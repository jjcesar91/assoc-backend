name: Deploy Backend

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Due ambienti di produzione sullo stesso host, stesso branch master:
    #   prod  → app.nonprofitgest.it      (~/management-software-prod)
    #   prod2 → app.gestionalenonprofit.it (~/management-software-prod2)
    # Deploy in sequenza (max-parallel 1) per non saturare l'host con due build
    # contemporanee; fail-fast off: un errore su un ambiente non blocca l'altro.
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - env_name: prod
            path_secret: DEPLOY_PATH_PROD
            project: backend_prod
            suffix: _prod
            gateway_port: "1080"
            ms_port_prefix: "400"
            debug_port_prefix: "102"
            db_port_prefix: "643"
          - env_name: prod2
            path_secret: DEPLOY_PATH_PROD2
            project: backend_prod2
            suffix: _prod2
            gateway_port: "2080"
            ms_port_prefix: "500"
            debug_port_prefix: "112"
            db_port_prefix: "743"
    name: deploy (${{ matrix.env_name }})
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          # Margine per l'attesa del lock (deploy di altri ambienti/repo in corso).
          command_timeout: 45m
          script: |
            set -e
            # Un solo deploy alla volta sull'host (dev, prod, prod2, backend e frontend
            # condividono lo stesso Docker daemon su una macchina da 4 GB): build
            # concorrenti mandano il daemon in timeout e lasciano container a meta'.
            exec 9>/tmp/assoc-deploy.lock
            echo "In attesa del lock di deploy..."
            flock 9
            # Timeout delle chiamate di docker-compose al daemon (default 60s).
            export COMPOSE_HTTP_TIMEOUT=300
            DEPLOY_DIR="${{ secrets[matrix.path_secret] }}"
            # Ambiente non ancora inizializzato sull'host (secret mancante o checkout
            # assente): si salta senza far fallire il deploy degli altri ambienti.
            if [ -z "$DEPLOY_DIR" ] || [ ! -d "$DEPLOY_DIR/.git" ]; then
              echo "::warning::Ambiente ${{ matrix.env_name }} non inizializzato ($DEPLOY_DIR): deploy saltato."
              exit 0
            fi
            cd "$DEPLOY_DIR"

            # Builda con il builder classico: le immagini cosi' generate includono
            # il metadato "ContainerConfig" richiesto da docker-compose v1, evitando
            # il bug "KeyError: 'ContainerConfig'" durante la ricreazione dei container.
            export DOCKER_BUILDKIT=0
            export COMPOSE_DOCKER_CLI_BUILD=0
            # Nome progetto dedicato per ambiente: isola rete/volumi dallo stack dev
            # (project "docker") e tra le due prod (backend_prod / backend_prod2).
            export COMPOSE_PROJECT_NAME=${{ matrix.project }}
            # Nomi container e porte host dell'ambiente (vedi docker/docker-compose.yml).
            export CONTAINER_SUFFIX=${{ matrix.suffix }}
            export GATEWAY_PORT=${{ matrix.gateway_port }}
            export MS_PORT_PREFIX=${{ matrix.ms_port_prefix }}
            export DEBUG_PORT_PREFIX=${{ matrix.debug_port_prefix }}
            export DB_PORT_PREFIX=${{ matrix.db_port_prefix }}
            SUFFIX=${{ matrix.suffix }}
            echo "Ambiente: ${{ matrix.env_name }} (progetto $COMPOSE_PROJECT_NAME)"

            BEFORE=$(git rev-parse HEAD)
            git pull origin master
            AFTER=$(git rev-parse HEAD)

            cd docker

            # Stack non ancora avviato (es. primo deploy di un nuovo ambiente):
            # rebuild completo anche se il checkout era gia' aggiornato.
            if [ -z "$(docker-compose ps -q)" ]; then
              echo "Nessun container attivo per $COMPOSE_PROJECT_NAME: avvio completo."
              CHANGED="docker/"
            elif [ "$BEFORE" = "$AFTER" ]; then
              echo "Nessuna modifica rilevata: nessun rebuild necessario."
              exit 0
            else
              CHANGED=$(git diff --name-only "$BEFORE" "$AFTER")
            fi
            echo "File modificati:"
            echo "$CHANGED"

            REBUILD_USERS=false
            REBUILD_PAYMENTS=false
            REBUILD_ACTIVITIES=false

            # Ricreazione robusta al bug di docker-compose v1 "KeyError: 'ContainerConfig'":
            # si rimuovono i container prima di ricrearli, cosi' compose non tenta di
            # ereditare i volumi dal vecchio container (i volumi named persistono comunque).
            # $@ = elenco servizi (vuoto = tutti). --no-deps e' innocuo quando $@ e' vuoto.
            recreate() {
              docker-compose build "$@"
              docker-compose rm -sf "$@" || true
              docker-compose up -d --no-deps "$@"
            }

            # Modifiche all'infrastruttura docker (compose, nginx.conf, ...) => rebuild completo
            if echo "$CHANGED" | grep -qE '^docker/'; then
              echo "Modifiche all'infrastruttura docker: rebuild completo."
              recreate
              docker-compose restart nginx || true
              REBUILD_USERS=true
              REBUILD_PAYMENTS=true
              REBUILD_ACTIVITIES=true
            else
              # Mappa i path services/<nome>/... sul relativo servizio compose <nome>_ms
              SERVICES=$(echo "$CHANGED" | sed -n 's#^services/\([^/]*\)/.*#\1_ms#p' | sort -u)
              if [ -z "$SERVICES" ]; then
                echo "Nessun microservizio toccato: nessun rebuild necessario."
                exit 0
              fi
              echo "Microservizi da ricostruire: $SERVICES"
              recreate $SERVICES
              if echo "$SERVICES" | grep -qw users_ms; then
                REBUILD_USERS=true
              fi
              if echo "$SERVICES" | grep -qw payments_ms; then
                REBUILD_PAYMENTS=true
              fi
              if echo "$SERVICES" | grep -qw activities_ms; then
                REBUILD_ACTIVITIES=true
              fi
            fi

            # Mostra i log delle migrazioni solo se users_ms e' stato ricostruito.
            # L'entrypoint va in retry-loop e infine abortisce (container Exited)
            # se le migrazioni falliscono: verifichiamo esplicitamente che il
            # container sia ancora in esecuzione, altrimenti falliamo il deploy
            # invece di riportare successo con un servizio giu'.
            if [ "$REBUILD_USERS" = "true" ]; then
              echo "Waiting for users_ms to complete migrations..."
              sleep 20
              docker logs users_ms$SUFFIX 2>&1 | grep -E "\[entrypoint\]|Migration" || true
              if [ "$(docker inspect -f '{{.State.Running}}' users_ms$SUFFIX 2>/dev/null)" != "true" ]; then
                echo "ERRORE: users_ms$SUFFIX non e' in esecuzione dopo il deploy (migrazioni fallite?)."
                docker logs users_ms$SUFFIX --tail 80
                exit 1
              fi
            fi

            # Idem per payments_ms (baseline + sequelize-cli db:migrate all'avvio)
            if [ "$REBUILD_PAYMENTS" = "true" ]; then
              echo "Waiting for payments_ms to complete migrations..."
              sleep 20
              docker logs payments_ms$SUFFIX 2>&1 | grep -E "\[entrypoint\]|\[baseline\]|migrat" || true
              if [ "$(docker inspect -f '{{.State.Running}}' payments_ms$SUFFIX 2>/dev/null)" != "true" ]; then
                echo "ERRORE: payments_ms$SUFFIX non e' in esecuzione dopo il deploy (migrazioni fallite?)."
                docker logs payments_ms$SUFFIX --tail 80
                exit 1
              fi
            fi

            # activities_ms esegue al boot sync({alter:true}) + il backfill dei dati
            # (es. CorsoOrari per i corsi con un solo giorno). Il backfill non blocca
            # l'avvio del servizio, quindi qui verifichiamo esplicitamente l'esito.
            if [ "$REBUILD_ACTIVITIES" = "true" ]; then
              echo "Waiting for activities_ms to complete migrations..."
              sleep 20
              ACTIVITIES_LOGS=$(docker logs activities_ms$SUFFIX 2>&1 | grep -E "synced successfully|Backfill|fallito" || true)
              echo "$ACTIVITIES_LOGS"
              if echo "$ACTIVITIES_LOGS" | grep -q "fallito"; then
                echo "ERRORE: il backfill di activities_ms e' fallito."
                exit 1
              fi
              if ! echo "$ACTIVITIES_LOGS" | grep -q "synced successfully"; then
                echo "ERRORE: activities_ms non ha completato la sincronizzazione del database."
                exit 1
              fi
            fi

            echo "Deploy completed."
