version: '3.8'

services:
  # Load balancer / Gateway
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-1080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - auth_ms
      - users_ms
      - documents_ms
      - products_ms
      - payments_ms
      - activities_ms
      - template_ms
    networks:
      - app_network

  # --- Template Service ---
  template_ms:
    build: ../services/template
    container_name: template_ms${CONTAINER_SUFFIX-_prod}
    # Sui server: node e non nodemon. Se il processo esce (es. database non ancora pronto
    # dopo un riavvio dell'host) il container si ferma e la restart policy lo rilancia;
    # nodemon invece restava acceso "in attesa di modifiche" con il servizio giù.
    command: ["node", "index.js"]
    restart: unless-stopped
    environment:
      - PORT=3000
      - DB_HOST=template_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=template_db
      - SERVICE_NAME=template-service
      - JWT_SECRET=super_secret_key_change_me
    ports:
      - "${MS_PORT_PREFIX:-400}1:3000" # Host:Container
      - "${DEBUG_PORT_PREFIX:-102}29:9229" # Debug port
    depends_on:
      - template_db
    volumes:
      - ../services/template:/app
      - /app/node_modules
    networks:
      - app_network


  template_db:
    image: postgres:13
    container_name: template_db${CONTAINER_SUFFIX-_prod}
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=template_db
    ports:
      - "${DB_PORT_PREFIX:-643}2:5432" # Host:Container
    volumes:
      - template_db_data:/var/lib/postgresql/data
    networks:
      - app_network

  # --- Auth Service ---
  auth_ms:
    build: ../services/auth
    container_name: auth_ms${CONTAINER_SUFFIX-_prod}
    command: ["node", "index.js"]
    restart: unless-stopped
    environment:
      - PORT=3000
      - DB_HOST=auth_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=auth_db
      - SERVICE_NAME=auth-service
      - JWT_SECRET=super_secret_key_change_me
      - JWT_REFRESH_SECRET=super_secret_refresh_key_change_me
      - INTERNAL_API_SECRET=internal_secret_change_me
      - WP_SSO_SECRET=wp_sso_secret_change_me
      - WP_BASE_URL=https://dominio.com
    ports:
      - "${MS_PORT_PREFIX:-400}2:3000"
      - "${DEBUG_PORT_PREFIX:-102}30:9229"
    depends_on:
      - auth_db
    volumes:
      - ../services/auth:/app
      - /app/node_modules
    networks:
      - app_network

  auth_db:
    image: postgres:13
    container_name: auth_db${CONTAINER_SUFFIX-_prod}
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=auth_db
    ports:
      - "${DB_PORT_PREFIX:-643}3:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    networks:
      - app_network

  # --- Users Service ---
  users_ms:
    build: ../services/users
    container_name: users_ms${CONTAINER_SUFFIX-_prod}
    command: ["node", "index.js"]
    restart: unless-stopped
    environment:
      - PORT=3000
      - DB_HOST=users_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=users_db
      - SERVICE_NAME=users-service
      - JWT_SECRET=super_secret_key_change_me
      - INTERNAL_API_SECRET=internal_secret_change_me
      - SMTP_HOST=mail.webassociazioni.it
      - SMTP_PORT=465
      - SMTP_SECURE=true
      - SMTP_USER=noreply
      - SMTP_PASSWORD=Plmjyrdx2026@
      - SMTP_FROM_EMAIL=noreplysmtp@webassociazioni.it
      - SMTP_FROM_NAME=WebAssociazioni
    ports:
      - "${MS_PORT_PREFIX:-400}3:3000"
      - "${DEBUG_PORT_PREFIX:-102}31:9229"
    depends_on:
      - users_db
    volumes:
      - ../services/users:/app
      - /app/node_modules
      - uploads_data:/app/uploads
    networks:
      - app_network

  users_db:
    image: postgres:13
    container_name: users_db${CONTAINER_SUFFIX-_prod}
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=users_db
    ports:
      - "${DB_PORT_PREFIX:-643}4:5432"
    volumes:
      - users_db_data:/var/lib/postgresql/data
    networks:
      - app_network

  # --- Documents Service ---
  documents_ms:
    build: ../services/documents
    container_name: documents_ms${CONTAINER_SUFFIX-_prod}
    command: ["node", "index.js"]
    restart: unless-stopped
    environment:
      - PORT=3000
      - DB_HOST=documents_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=documents_db
      - SERVICE_NAME=documents-service
      - JWT_SECRET=super_secret_key_change_me
    ports:
      - "${MS_PORT_PREFIX:-400}4:3000"
      - "${DEBUG_PORT_PREFIX:-102}32:9229"
    depends_on:
      - documents_db
    volumes:
      - ../services/documents:/app
      - /app/node_modules
    networks:
      - app_network

  documents_db:
    image: postgres:13
    container_name: documents_db${CONTAINER_SUFFIX-_prod}
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=documents_db
    ports:
      - "${DB_PORT_PREFIX:-643}5:5432"
    volumes:
      - documents_db_data:/var/lib/postgresql/data
    networks:
      - app_network

  # --- Products Service ---
  products_ms:
    build: ../services/products
    container_name: products_ms${CONTAINER_SUFFIX-_prod}
    command: ["sh", "-c", "npx sequelize-cli db:migrate && exec node index.js"]
    restart: unless-stopped
    environment:
      - PORT=3000
      - DB_HOST=products_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=products_db
      - SERVICE_NAME=products-service
      - JWT_SECRET=super_secret_key_change_me
    ports:
      - "${MS_PORT_PREFIX:-400}5:3000"
      - "${DEBUG_PORT_PREFIX:-102}33:9229"
    depends_on:
      - products_db
    volumes:
      - ../services/products:/app
      - /app/node_modules
    networks:
      - app_network

  products_db:
    image: postgres:13
    container_name: products_db${CONTAINER_SUFFIX-_prod}
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=products_db
    ports:
      - "${DB_PORT_PREFIX:-643}6:5432"
    volumes:
      - products_db_data:/var/lib/postgresql/data
    networks:
      - app_network

  # --- Payments Service ---
  payments_ms:
    build: ../services/payments
    container_name: payments_ms${CONTAINER_SUFFIX-_prod}
    command: ["node", "index.js"]
    restart: unless-stopped
    environment:
      - PORT=3000
      - DB_HOST=payments_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=payments_db
      - SERVICE_NAME=payments-service
      - JWT_SECRET=super_secret_key_change_me
      - INTERNAL_API_SECRET=internal_secret_change_me
      - USERS_SERVICE_URL=http://users_ms:3000
      - PRODUCTS_SERVICE_URL=http://products_ms:3000
    ports:
      - "${MS_PORT_PREFIX:-400}6:3000"
      - "${DEBUG_PORT_PREFIX:-102}34:9229"
    depends_on:
      - payments_db
    volumes:
      - ../services/payments:/app
      - /app/node_modules
      - uploads_data:/app/uploads
    networks:
      - app_network

  payments_db:
    image: postgres:13
    container_name: payments_db${CONTAINER_SUFFIX-_prod}
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=payments_db
    ports:
      - "${DB_PORT_PREFIX:-643}7:5432"
    volumes:
      - payments_db_data:/var/lib/postgresql/data
    networks:
      - app_network

  # --- Activities Service ---
  activities_ms:
    build: ../services/activities
    container_name: activities_ms${CONTAINER_SUFFIX-_prod}
    command: ["node", "index.js"]
    restart: unless-stopped
    environment:
      - PORT=3000
      - DB_HOST=activities_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=activities_db
      - SERVICE_NAME=activities-service
      - JWT_SECRET=super_secret_key_change_me
    ports:
      - "${MS_PORT_PREFIX:-400}7:3000"
      - "${DEBUG_PORT_PREFIX:-102}35:9229"
    depends_on:
      - activities_db
    volumes:
      - ../services/activities:/app
      - /app/node_modules
    networks:
      - app_network

  activities_db:
    image: postgres:13
    container_name: activities_db${CONTAINER_SUFFIX-_prod}
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=activities_db
    ports:
      - "${DB_PORT_PREFIX:-643}8:5432"
    volumes:
      - activities_db_data:/var/lib/postgresql/data
    networks:
      - app_network

  # NB: il frontend e' stato spostato nel repo assoc-frontend
  # (assoc-frontend/docker/docker-compose.yml), avviato dalla sua GitHub Action.

volumes:
  uploads_data:
  activities_db_data:
  template_db_data:
  auth_db_data:
  users_db_data:
  documents_db_data:
  products_db_data:
  payments_db_data:

networks:
  app_network:
    driver: bridge
